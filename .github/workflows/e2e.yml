name: e2e

on:
  push:
    branches: [main, "wip/**"]
  # On a pull request, only when it changes something that reaches the cluster.
  pull_request:
    paths:
      - app/**
      - chart/**
      - cluster/**
      - e2e/**
      - loadgen/**
      - scripts/**
      - Dockerfile
      - Makefile
      - pyproject.toml
      - requirements*.txt
      - versions.env
      - .github/workflows/e2e.yml

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: end-to-end tests on a kind cluster
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the pinned versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      # A runner comes with its own kind, kubectl and helm, at whatever versions
      # its image was built with. The pinned ones go first on the PATH.
      - name: Install kind, kubectl and helm at the pinned versions
        run: |
          scripts/install-tools.sh "$RUNNER_TEMP/bin" kind kubectl helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Each grep prints the line it matched and fails the step if there is none.
      - name: Check that the pinned versions are the ones in use
        run: |
          kind version | grep --fixed-strings "kind v$KIND_VERSION "
          kubectl version --client | grep --fixed-strings "Client Version: v$KUBERNETES_VERSION"
          helm version --short | grep --fixed-strings "v$HELM_VERSION+"
      # Before the cluster exists, so that the script can put a kubeconfig of
      # its own where the cluster's will be.
      - name: Check that make and the tests refuse any context but the kind cluster's
        run: scripts/test-cluster-guard.sh
      - name: Create the kind cluster, install Prometheus and Grafana, build the image, install the chart
        run: make up
      - name: Run the end-to-end tests
        run: make e2e
      # What the tests measured under load, and when the alert fired and
      # cleared: a table and notes on the run's summary page, and the reports
      # themselves as an artifact. Also when a test has failed.
      - name: Write the tests' results to the job summary
        if: always()
        run: python -m e2e.summary >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the load reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Collect events and pod logs
        if: failure()
        run: make diagnostics
      - name: Upload events and pod logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics
          path: diagnostics/
          retention-days: 14
