name: e2e

on:
  push:
    branches: [main, "wip/**"]
  # On a pull request, only when it changes something that reaches the cluster.
  pull_request:
    paths:
      - app/**
      - chart/**
      - cluster/**
      - e2e/**
      - loadgen/**
      - scripts/**
      - Dockerfile
      - Makefile
      - pyproject.toml
      - requirements*.txt
      - versions.env
      - .github/workflows/e2e.yml
  # Every night, on main. No commit has changed anything by then, so a run
  # that fails has met something outside the repository, a runner image or a
  # registry, or a test that does not pass every time. Not on the hour, when
  # most schedules are due and GitHub starts them late.
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
# The event is part of the group, so that the nightly run and a push to main,
# which are on the same branch, leave each other alone.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: end-to-end tests on kind, Kubernetes ${{ matrix.kubernetes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Each release runs to its end, also when the other has failed: whether
      # a failure shows on both or on one is the first thing to know about it.
      fail-fast: false
      matrix:
        # Two Kubernetes releases. `kubernetes` names the job, and `node-image`
        # names the line in versions.env that pins that release's node image.
        # The step after `make up` fails if the two do not go together.
        include:
          - kubernetes: "1.36"
            node-image: KIND_NODE_IMAGE
          - kubernetes: "1.35"
            node-image: KIND_PREVIOUS_NODE_IMAGE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the pinned versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      # A runner comes with its own kind, kubectl and helm, at whatever versions
      # its image was built with. The pinned ones go first on the PATH.
      - name: Install kind, kubectl and helm at the pinned versions
        run: |
          scripts/install-tools.sh "$RUNNER_TEMP/bin" kind kubectl helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Each grep prints the line it matched and fails the step if there is none.
      - name: Check that the pinned versions are the ones in use
        run: |
          kind version | grep --fixed-strings "kind v$KIND_VERSION "
          kubectl version --client | grep --fixed-strings "Client Version: v$KUBERNETES_VERSION"
          helm version --short | grep --fixed-strings "v$HELM_VERSION+"
      # Before the cluster exists, so that the script can put a kubeconfig of
      # its own where the cluster's will be.
      - name: Check that make and the tests refuse any context but the kind cluster's
        run: scripts/test-cluster-guard.sh
      # A variable on make's command line replaces the one of the same name
      # that the Makefile reads from versions.env.
      - name: Create the kind cluster, install Prometheus, Grafana and KEDA, build the image, install the chart
        run: make up KIND_NODE_IMAGE="${{ env[matrix.node-image] }}"
      # The node image decides which Kubernetes the cluster runs, so the API
      # server is asked. grep prints its answer, or fails the step.
      - name: Check that the cluster runs the Kubernetes release this job is named after
        run: |
          kubectl --kubeconfig .kube/config version |
            grep "Server Version: v${{ matrix.kubernetes }}\."
      - name: Run the end-to-end tests
        run: make e2e
      # What the tests measured: the requests each load sent, how many failed
      # and how long they took, the replica counts the autoscaler went
      # through, and when the alert fired and cleared. Also when a test has
      # failed. The last line is the runner's memory: three nodes, Prometheus,
      # Grafana and KEDA share it, and it is the first thing to run short. tee
      # writes all of it to the run's summary page and to this step's log.
      - name: Write the tests' results to the job summary and the log
        if: always()
        run: |
          python -m e2e.summary > "$RUNNER_TEMP/summary.md"
          free --mebi | awk '/^Mem:/ {
            printf "\nMemory of the runner after the tests: %d of %d MiB in use, %d MiB available.\n", $3, $2, $7
          }' >> "$RUNNER_TEMP/summary.md"
          tee --append "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/summary.md"
      # On every run, not only on a failed one: a run that passed is what a
      # failed one is compared with, and collecting every time keeps the
      # collecting itself in working order.
      - name: Collect events and pod logs
        if: always()
        run: make diagnostics
      - name: Upload the load reports, events and pod logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-kubernetes-${{ matrix.kubernetes }}
          path: |
            reports/
            diagnostics/
          if-no-files-found: ignore
          retention-days: 14
