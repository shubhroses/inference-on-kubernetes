name: ci

on:
  push:
    branches: [main, "wip/**"]
  pull_request:
  # Every week, on main, for what changes without a push. Trivy's database of
  # vulnerabilities is not pinned, so the image that passed the scan one week
  # can fail it the next, when a fix has been published for something in it.
  # The other jobs run as well: they fetch their tools, packages and schemas
  # from registries, from PyPI and from GitHub, and a run in a week without a
  # push shows whether all of that is still there.
  schedule:
    - cron: "43 6 * * 1" # Mondays at 06:43 UTC

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
# The event is part of the group, so that the weekly run and a push to main,
# which are on the same branch, leave each other alone.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Tool and image versions come from versions.env. Each job copies its NAME=value
# lines into the environment of the steps that follow.
jobs:
  python:
    name: ruff and pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the pinned versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github .
      - name: Check formatting
        run: ruff format --check .
      - name: Unit tests, with the coverage floor
        run: make test

  lint:
    name: actionlint, shellcheck and pins
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the pinned versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - name: Lint the workflows
        run: >
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo
          "$ACTIONLINT_IMAGE" -color
      # The actionlint image carries shellcheck, which it runs on the workflows'
      # `run:` steps. The same binary lints the scripts. --external-sources lets
      # it read versions.env where a script sources it.
      - name: Lint the shell scripts
        run: >
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo --entrypoint shellcheck
          "$ACTIONLINT_IMAGE" --external-sources scripts/*.sh
      # The five steps below each print the lines that break the rule, if any.
      - name: Check that every image and chart in versions.env is pinned by digest
        run: |
          if grep -E '^[A-Z0-9_]+_(IMAGE|CHART)=' versions.env | grep -Ev '@sha256:[0-9a-f]{64}$'; then
            exit 1
          fi
      - name: Check that every schema repository in versions.env is pinned to a commit SHA
        run: |
          if grep -E '^[A-Z0-9_]+_COMMIT=' versions.env | grep -Ev '=[0-9a-f]{40}$'; then
            exit 1
          fi
      - name: Check that every action is pinned to a commit SHA
        run: |
          if grep -rnE '^[[:space:]]*(- )?uses:' .github/workflows | grep -Ev 'uses: [^@ ]+@[0-9a-f]{40}( |$)'; then
            exit 1
          fi
      - name: Check that the Dockerfile's base image is the one in versions.env
        run: |
          if ! grep --fixed-strings --line-regexp "FROM ${PYTHON_IMAGE} AS base" Dockerfile; then
            grep -n '^FROM' Dockerfile
            exit 1
          fi
      - name: Check that the kind node image is the Kubernetes version in versions.env
        run: |
          if ! echo "$KIND_NODE_IMAGE" | grep --fixed-strings ":v${KUBERNETES_VERSION}@sha256:"; then
            grep -E '^(KUBERNETES_VERSION|KIND_NODE_IMAGE)=' versions.env
            exit 1
          fi

  chart:
    name: helm lint, kubeconform and promtool
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the pinned versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - name: Install helm at the pinned version
        run: |
          scripts/install-tools.sh "$RUNNER_TEMP/bin" helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Both steps run twice: with the chart's defaults, and with what the kind
      # cluster changes. image.tag has no default, so it is given here.
      - name: Lint the chart
        run: |
          helm version --short | grep --fixed-strings "v$HELM_VERSION+"
          helm lint --strict chart --set-string image.tag="$GITHUB_SHA"
          helm lint --strict chart --values chart/values-kind.yaml --set-string image.tag="$GITHUB_SHA"
      # kubeconform checks each rendered object against the API schema of the
      # Kubernetes version the test cluster runs, so a misspelt field or a value
      # of the wrong type fails here, without a cluster. It is given two places
      # to look, each a repository at the commit pinned in versions.env. The
      # first is where it looks by default, for the kinds that are part of
      # Kubernetes; it is written out so that the commit can be named, and
      # kubeconform adds the path of each schema itself. The second is for
      # the kinds Kubernetes itself does not define, such as ServiceMonitor;
      # kubeconform fills in the {{ }} parts for each object.
      # pipefail makes a failing `helm template` fail the step, where it would
      # otherwise hand kubeconform an empty input to approve.
      - name: Validate the rendered manifests against the API schemas
        run: |
          set -o pipefail
          kubernetes_schemas="https://raw.githubusercontent.com/yannh/kubernetes-json-schema/$KUBERNETES_SCHEMAS_COMMIT"
          crd_schemas="https://raw.githubusercontent.com/datreeio/CRDs-catalog/$CRD_SCHEMAS_COMMIT"
          for values in chart/values.yaml chart/values-kind.yaml; do
            echo "With $values:"
            helm template inference chart --namespace inference --values "$values" \
              --set-string image.tag="$GITHUB_SHA" |
              docker run --rm --interactive "$KUBECONFORM_IMAGE" \
                -strict -verbose -summary -kubernetes-version "$KUBERNETES_VERSION" \
                -schema-location "$kubernetes_schemas" \
                -schema-location "$crd_schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" -
          done
      # kubeconform has checked the shape of the PrometheusRule and the
      # ScaledObject and knows nothing of the expressions inside them.
      # promtool, from the image of the Prometheus release the test cluster
      # runs, reads the rules the way Prometheus will, and then runs the unit
      # tests in tests/rules/: when each alert fires and clears, with the
      # chart's default windows and thresholds, and what number the
      # autoscaler's query gives it to scale on.
      - name: Check the alert rules and the autoscaler's query, and run their unit tests
        run: scripts/test-rules.sh

  image:
    name: hadolint, docker build and trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: inference-on-kubernetes:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the pinned versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - name: Lint the Dockerfile
        run: docker run --rm --interactive "$HADOLINT_IMAGE" < Dockerfile
      # The same target `make up` builds the image with. It tags the image with
      # the commit, which is the name this job's IMAGE has.
      - name: Build the image
        run: make image
      - name: Check that the image has the Python version the unit tests ran on
        run: |
          in_image=$(docker run --rm "$IMAGE" python --version)
          echo "In the image: $in_image. In versions.env: Python $PYTHON_VERSION."
          test "$in_image" = "Python $PYTHON_VERSION"
      - name: Run the image as non-root on a read-only root filesystem
        run: scripts/test-image.sh "$IMAGE" "$GITHUB_SHA"
      # The scanner runs in a container that is given the image as a file and
      # nothing else: not the Docker socket, not the checkout. --ignore-unfixed
      # leaves out findings for which no fixed version has been published,
      # since there is nothing to upgrade to.
      - name: Scan the image, failing on High or Critical findings that have a fix
        run: |
          docker save --output "$RUNNER_TEMP/image.tar" "$IMAGE"
          docker run --rm --volume "$RUNNER_TEMP/image.tar:/image.tar:ro" "$TRIVY_IMAGE" image \
            --input /image.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress
