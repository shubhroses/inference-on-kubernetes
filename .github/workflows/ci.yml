name: ci

on:
  push:
    branches: [main, "wip/**"]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tool and image versions come from versions.env. Each job copies its NAME=value
# lines into the environment of the steps that follow.
jobs:
  python:
    name: ruff and pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the pinned versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github .
      - name: Check formatting
        run: ruff format --check .
      - name: Unit tests
        run: coverage run -m pytest
      - name: Coverage floor
        run: coverage report

  lint:
    name: actionlint, shellcheck and pins
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the pinned versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - name: Lint the workflows
        run: >
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo
          "$ACTIONLINT_IMAGE" -color
      # The actionlint image carries shellcheck, which it runs on the workflows'
      # `run:` steps. The same binary lints the scripts.
      - name: Lint the shell scripts
        run: >
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo --entrypoint shellcheck
          "$ACTIONLINT_IMAGE" scripts/*.sh
      # The three steps below each print the lines that break the rule, if any.
      - name: Check that every image in versions.env is pinned by digest
        run: |
          if grep -E '^[A-Z0-9_]+_IMAGE=' versions.env | grep -Ev '@sha256:[0-9a-f]{64}$'; then
            exit 1
          fi
      - name: Check that every action is pinned to a commit SHA
        run: |
          if grep -rnE '^[[:space:]]*(- )?uses:' .github/workflows | grep -Ev 'uses: [^@ ]+@[0-9a-f]{40}( |$)'; then
            exit 1
          fi
      - name: Check that the Dockerfile's base image is the one in versions.env
        run: |
          if ! grep --fixed-strings --line-regexp "FROM ${PYTHON_IMAGE} AS base" Dockerfile; then
            grep -n '^FROM' Dockerfile
            exit 1
          fi

  image:
    name: hadolint, docker build and trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: inference-on-kubernetes:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the pinned versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - name: Lint the Dockerfile
        run: docker run --rm --interactive "$HADOLINT_IMAGE" < Dockerfile
      - name: Build the image
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" --tag "$IMAGE" .
      - name: Check that the image has the Python version the unit tests ran on
        run: |
          in_image=$(docker run --rm "$IMAGE" python --version)
          echo "In the image: $in_image. In versions.env: Python $PYTHON_VERSION."
          test "$in_image" = "Python $PYTHON_VERSION"
      - name: Run the image as non-root on a read-only root filesystem
        run: scripts/test-image.sh "$IMAGE" "$GITHUB_SHA"
      # The scanner runs in a container that is given the image as a file and
      # nothing else: not the Docker socket, not the checkout. --ignore-unfixed
      # leaves out findings for which no fixed version has been published,
      # since there is nothing to upgrade to.
      - name: Scan the image, failing on High or Critical findings that have a fix
        run: |
          docker save --output "$RUNNER_TEMP/image.tar" "$IMAGE"
          docker run --rm --volume "$RUNNER_TEMP/image.tar:/image.tar:ro" "$TRIVY_IMAGE" image \
            --input /image.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress
