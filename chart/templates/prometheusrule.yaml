# The rules Prometheus evaluates for this release: the share of failed requests
# over each window the alerts look at, recorded as a series, and four alerts.
# Like the ServiceMonitor, a PrometheusRule is an object of the Prometheus
# Operator. values.yaml explains the numbers; tests/rules/ checks when the
# alerts fire.
#
# Every expression selects this release's own series, by the namespace and by
# the job, which is the name of the Service. Two releases in one cluster then
# never count each other's requests.
{{- $thisRelease := printf "namespace=%q, job=%q" .Release.Namespace .Release.Name }}
{{- $errorRatio := "namespace_job:inference_errors_per_request:ratio_rate" }}
{{- $objective := .Values.slo.objective }}
{{- $fastBurn := .Values.alerts.fastBurn }}
{{- $slowBurn := .Values.alerts.slowBurn }}
{{- $maxReplicas := int .Values.autoscaling.maxReplicas }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "inference.labels" . | nindent 4 }}
spec:
  groups:
    # One group: its rules are evaluated one after the other, at the same
    # moment, so the alerts read the error ratios recorded just before them.
    - name: {{ .Release.Name }}
      interval: {{ .Values.alerts.evaluationInterval }}
      rules:
        # The error ratio: requests that were not answered successfully, as a
        # share of all requests, over one window. Errors (5xx) and rejections
        # (429) both count. The window is a label and not part of the name,
        # so that a dashboard can draw whichever windows are set without
        # knowing them: they are chart values, because a test cluster needs
        # shorter ones. A window two alerts share is recorded once.
        {{- range $window := list $fastBurn.shortWindow $slowBurn.shortWindow $fastBurn.longWindow $slowBurn.longWindow | uniq }}
        - record: {{ $errorRatio }}
          expr: |
            sum by (namespace, job) (rate(inference_requests_total{ {{ $thisRelease }}, outcome!="ok" }[{{ $window }}]))
            /
            sum by (namespace, job) (rate(inference_requests_total{ {{ $thisRelease }} }[{{ $window }}]))
          labels:
            window: {{ $window | quote }}
        {{- end }}

        # The two alerts on the error budget. The budget is 1 - objective, and
        # an error ratio of burnRate times the budget spends it burnRate times
        # too fast. Each alert fires while the error ratio is above that over
        # its long and its short window. The two sides differ in the window
        # label, which the `and` therefore has to ignore; the alert keeps the
        # long window's labels and value.
        - alert: InferenceErrorBudgetFastBurn
          expr: |
            {{ $errorRatio }}{ {{ $thisRelease }}, window={{ $fastBurn.longWindow | quote }} } > {{ $fastBurn.burnRate }} * (1 - {{ $objective }})
            and ignoring (window)
            {{ $errorRatio }}{ {{ $thisRelease }}, window={{ $fastBurn.shortWindow | quote }} } > {{ $fastBurn.burnRate }} * (1 - {{ $objective }})
          labels:
            severity: page
          annotations:
            summary: Requests are failing {{ $fastBurn.burnRate }} times faster than the objective of {{ $objective }} allows.
            description: >-
              The share of requests answered with a 5xx or shed with a 429 has
              been more than {{ $fastBurn.burnRate }} times the error budget over the last
              {{ $fastBurn.longWindow }} and over the last {{ $fastBurn.shortWindow }}.
        - alert: InferenceErrorBudgetSlowBurn
          expr: |
            {{ $errorRatio }}{ {{ $thisRelease }}, window={{ $slowBurn.longWindow | quote }} } > {{ $slowBurn.burnRate }} * (1 - {{ $objective }})
            and ignoring (window)
            {{ $errorRatio }}{ {{ $thisRelease }}, window={{ $slowBurn.shortWindow | quote }} } > {{ $slowBurn.burnRate }} * (1 - {{ $objective }})
          labels:
            severity: ticket
          annotations:
            summary: Requests are failing {{ $slowBurn.burnRate }} times faster than the objective of {{ $objective }} allows.
            description: >-
              The share of requests answered with a 5xx or shed with a 429 has
              been more than {{ $slowBurn.burnRate }} times the error budget over the last
              {{ $slowBurn.longWindow }} and over the last {{ $slowBurn.shortWindow }}.

        # Latency: the 95th percentile of the successful requests, estimated
        # from the histogram's buckets. With the threshold on a bucket bound
        # the comparison is exact: it holds when fewer than 95% of the requests
        # are in the buckets up to that bound. Rejections are left out: they
        # are answered at once and would only make the service look fast.
        - alert: InferenceLatencyHigh
          expr: |
            histogram_quantile(0.95, sum by (namespace, job, le) (
              rate(inference_request_duration_seconds_bucket{ {{ $thisRelease }}, outcome="ok" }[5m])
            )) > {{ .Values.alerts.latency.p95Seconds }}
          for: 5m
          labels:
            severity: ticket
          annotations:
            summary: One successful request in twenty takes longer than {{ .Values.alerts.latency.p95Seconds }} s.
            description: >-
              The 95th percentile of the time successful requests take, waiting
              for a model slot included, has been above {{ .Values.alerts.latency.p95Seconds }} s for five
              minutes.

        # Saturation: requests are waiting for a slot and no pod can be added,
        # because the autoscaler has already taken the Deployment to its
        # maximum. The queue is read from the service's pods and the replica
        # count from kube-state-metrics, whose series carry other labels, so
        # the two sides are matched on the namespace alone.
        - alert: InferenceQueueAtMaxReplicas
          expr: |
            sum by (namespace, job) (inference_requests_queued{ {{ $thisRelease }} }) > 0
            and on (namespace)
            max by (namespace) (kube_deployment_spec_replicas{namespace={{ .Release.Namespace | quote }}, deployment={{ .Release.Name | quote }}}) >= {{ $maxReplicas }}
          for: 5m
          labels:
            severity: ticket
          annotations:
            summary: Requests are queueing and the Deployment is at its maximum of {{ $maxReplicas }} replicas.
            description: >-
              Requests have been waiting for a model slot for five minutes
              while the Deployment already has as many replicas as it may
              have. More load will be shed with 429s.
