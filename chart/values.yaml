# Defaults, shaped for a real cluster. values-kind.yaml holds what the test
# cluster changes.

# Annotations for the pods; the chart sets none of its own. Adding or changing
# one changes the pod template, and so replaces every pod in a rolling update.
podAnnotations: {}

image:
  # The name `make image` gives the image it builds. This project publishes no
  # image: for a real cluster, push your build to a registry the cluster can
  # pull from and put its path here.
  repository: inference-on-kubernetes
  # Required: the build to run. `make up` passes the commit the image was
  # built from. There is no default, because no single tag would be right.
  tag: ""
  pullPolicy: IfNotPresent

# The stand-in model's settings, handed to the service as environment variables.
model:
  # Requests one pod serves at the same time.
  slots: 8
  # Requests one pod lets wait for a slot. Any more are answered with 429.
  queueSize: 16
  # Seconds the stand-in holds a slot for one request.
  inferSeconds: 0.1
  # Seconds the simulated model load takes when a pod starts. The pod is not
  # Ready, and so gets no requests, until it is over.
  loadSeconds: 2

# How many pods there are. An autoscaler decides it, from one number: the
# requests in the service, those running in a slot and those waiting for one,
# divided by the pods. KEDA reads that number from Prometheus and hands it to
# a HorizontalPodAutoscaler; templates/scaledobject.yaml has the query.
#
# The number and not the pods' CPU, because CPU says little here. A request
# holds a slot for as long as the model takes, and the pod's own CPU is close
# to idle meanwhile: the stand-in sleeps, and a real model would be busy on a
# GPU. What tells a full pod from an empty one is how many requests it holds.
autoscaling:
  # Never fewer than two pods, so that one can be replaced or drained while
  # the other serves, and never more than the most the service may cost.
  # Requests that queue while the Deployment is at the maximum raise an alert.
  minReplicas: 2
  maxReplicas: 6
  # The number the autoscaler aims for: this many requests per pod, running
  # or waiting. Below model.slots on purpose. At 6 of 8 a pod still has two
  # slots free, so pods are added before requests have to wait, not after.
  targetRequestsPerPod: 6
  # The number is averaged over this long before it is acted on. A scrape
  # catches each pod at one instant, every pod at a different one, and with
  # requests moving from pod to pod a single reading can be several requests
  # off: enough to add a pod that nothing needed. Longer is steadier and
  # slower. The window has to hold several scrapes (metrics.scrapeInterval).
  window: 1m
  # Up: at most this many pods in any period of this many seconds. A queue
  # says that there are too few pods; it does not say how many are missing.
  # When requests arrive only a little faster than the pods can serve them,
  # the queues fill to the brim all the same, and the number reads as if
  # several times the pods were needed. So pods are added one at a time, and
  # each has half a minute to start, load its model and take its share,
  # which empties the queues if it was enough, before the next is decided on.
  scaleUp:
    pods: 1
    periodSeconds: 30
  # Down: a pod goes only when the number has asked for fewer pods all
  # through this many seconds; the autoscaler acts on the highest count the
  # number asked for in that time. A lull of a minute then removes no pod
  # that is needed again the minute after and would have to load its model
  # first.
  scaleDown:
    stabilizationWindowSeconds: 300
  # Where KEDA finds the Prometheus that scrapes this release. The default is
  # the address the kube-prometheus-stack chart gives it when that chart is
  # released under its own name in the namespace `monitoring`.
  prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090

# The test flag. On, a request can ask to fail (?fail=true) or to take longer
# (?delay=seconds), which is how a test produces errors on purpose. Off, the
# service accepts both parameters and ignores them. Leave it off wherever
# anyone but a test can reach the service.
faultInjection: false

service:
  # The port clients inside the cluster connect to.
  port: 80

# How a pod is taken out of service without failing a request, whether it goes
# in a rolling update, a node drain or a scale-down. The steps, in order:
#
#   1. Kubernetes marks the pod as terminating. Every node stops sending it
#      new connections, each as soon as it hears of it. The pod itself is not
#      told yet and serves as before, for preStopSeconds.
#   2. The service gets SIGTERM and stops listening. Connections that are open
#      are still served: each is told `Connection: close` with its next
#      response, or is closed once it has been idle for keepAliveSeconds.
#   3. Requests that are still running or queued get requestSeconds more.
#
# The process then exits by itself. The three add up to the pod's
# terminationGracePeriodSeconds, after which the kubelet kills what is left.
termination:
  # Has to be longer than it takes the news of step 1 to reach every node. If
  # it is not, a new connection arrives at a pod that has stopped listening.
  # In the one CI run made without this delay, new connections were refused
  # for 0.7 s and 0.9 s, so on the kind cluster the news took under a second.
  preStopSeconds: 10
  # How long the service keeps an idle connection open, at any time, and so
  # also how long a stopping pod waits for its open connections in step 2. A
  # client must not reuse a connection that has been idle for this long.
  keepAliveSeconds: 5
  # More than the longest request takes: a full queue's wait for a slot, plus
  # one run of the model.
  requestSeconds: 15

metrics:
  # How often Prometheus scrapes each pod. Nothing that is worked out from the
  # metrics can notice a change sooner than this.
  scrapeInterval: 15s

# The service level objective: the share of requests that has to be answered
# successfully. A request answered with a 5xx and a request shed with a 429
# both count as failed. What the objective leaves over, here 1% of the
# requests, is the error budget.
slo:
  objective: 0.99

# The alerts, which templates/prometheusrule.yaml turns into rules for
# Prometheus.
alerts:
  # How often Prometheus works out the error ratios and checks the alerts. An
  # alert fires or clears at most this long after its condition changed.
  evaluationInterval: 30s

  # The two alerts on the error budget. Each watches the burn rate: how many
  # times faster than the objective allows the budget is being spent. At 1, a
  # budget meant for 30 days lasts 30 days; at 14.4, two days.
  #
  # An alert fires while the burn rate is above its threshold over both of its
  # windows. The long window makes sure that a real share of the budget is
  # gone and not just one bad minute. The short window makes sure that the
  # budget is still being spent, so the alert clears soon after the failures
  # stop, long before they have left the long window.
  #
  # What an alert costs before it fires is its burn rate times its long
  # window, whatever the share of failing requests: the larger the share, the
  # sooner the long window crosses the threshold. Against a 30-day budget (720
  # hours) that is 14.4 x 1 h / 720 h = 2% for the first and
  # 6 x 6 h / 720 h = 5% for the second. The thresholds and windows are the
  # ones the Google SRE Workbook recommends for those two shares.
  #
  # Fast burn pages someone: at this rate the budget is gone within days.
  fastBurn:
    burnRate: 14.4
    longWindow: 1h
    shortWindow: 5m
  # Slow burn opens a ticket: too slow to wake anyone, too fast to ignore.
  slowBurn:
    burnRate: 6
    longWindow: 6h
    shortWindow: 30m

  latency:
    # A ticket when, for five minutes, fewer than 95% of the successful
    # requests have been answered within this many seconds. It has to be one
    # of the bucket bounds of the service's duration histogram (0.1, 0.25,
    # 0.5, 1, 2.5 and so on; see app/metrics.py): Prometheus knows how many
    # requests were faster than each bound and nothing about where they fall
    # in between. With the defaults above a request takes 0.1 s, and 0.3 s at
    # most when it has to wait behind a full queue, so half a second means
    # that something else is slow.
    p95Seconds: 0.5

# Measured once by hand on a laptop with the defaults above (no test checks
# it): a pod uses about 40 MiB of memory, and about a tenth of a core when all
# eight slots are busy.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    # The service is one process with one event loop, so it cannot use more
    # than one core. The limit states that ceiling; it does not squeeze the
    # service below what it could use.
    cpu: "1"
    # Equal to the request. Memory cannot be throttled the way CPU can, so the
    # scheduler sets aside all that the container is allowed to use.
    memory: 128Mi
